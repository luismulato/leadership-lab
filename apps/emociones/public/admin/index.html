<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Listado de Emociones</title>
<style>
  :root { --bg:#faf7f2; --fg:#1d1b19; --mut:#6b655d; --line:#e2dccf; --ac:#1f6f5c; --bad:#b3261e; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#171513; --fg:#f1ece4; --mut:#a39b8f; --line:#332f2a; --ac:#5fc4a8; --bad:#f2837c; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; padding:24px 16px; }
  main { max-width:860px; margin:0 auto; }
  h1 { font-size:1.3rem; margin:0 0 4px; } p.sub { color:var(--mut); margin:0 0 20px; }
  form { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  input, button { font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); }
  input { flex:1 1 220px; } button { cursor:pointer; } button.p { background:var(--ac); color:#fff; border-color:var(--ac); }
  button.d { color:var(--bad); border-color:var(--bad); }
  .tabla { overflow-x:auto; } table { width:100%; border-collapse:collapse; min-width:560px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--mut); font-weight:600; font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; }
  code { font-family:ui-monospace,monospace; font-weight:700; letter-spacing:.06em; }
  .tag { font-size:.75rem; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--mut); }
  .acc { display:flex; gap:6px; } #msg { min-height:1.4em; color:var(--bad); }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--fg); max-width:420px; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
</style>
</head>
<body>
<main>
  <h1>Admin · Listado de Emociones</h1>
  <p class="sub">Equipos creados y sus códigos.</p>
  <form id="f"><input id="clave" type="password" placeholder="Clave de admin" autocomplete="current-password" required><button class="p">Entrar</button></form>
  <div id="msg" role="alert"></div>
  <div class="tabla" id="tabla" hidden>
    <table><thead><tr><th>Equipo</th><th>Código</th><th>Creado</th><th></th></tr></thead><tbody id="filas"></tbody></table>
  </div>
</main>
<dialog id="dlg"><form method="dialog" id="df">
  <p id="dt"></p><input id="dc" placeholder="Escribí el código" autocomplete="off">
  <div class="acc" style="margin-top:12px"><button class="d" id="dok" value="ok">Borrar</button><button value="no">Cancelar</button></div>
</form></dialog>
<script>
let CLAVE = "";
try { CLAVE = sessionStorage.getItem("admin-clave") || ""; } catch {}
const $ = (id) => document.getElementById(id), msg = (t) => { $("msg").textContent = t || ""; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function api(method, path) {
  const r = await fetch("/emociones/api/admin" + path, { method, headers: { "x-admin-clave": CLAVE } });
  let j = {}; try { j = await r.json(); } catch {}
  return { ok: r.ok, status: r.status, j };
}
async function cargar() {
  const r = await api("GET", "/boards");
  if (!r.ok) { $("tabla").hidden = true; msg(r.status === 403 ? "Clave incorrecta." : "No se pudo cargar."); try { sessionStorage.removeItem("admin-clave"); } catch {} return; }
  try { sessionStorage.setItem("admin-clave", CLAVE); } catch {}
  msg(""); $("tabla").hidden = false;
  $("filas").innerHTML = r.j.boards.map((b) => `<tr>
    <td>${esc(b.name)} ${b.example ? '<span class="tag">ejemplo</span>' : ""}</td>
    <td><code>${esc(b.code)}</code></td>
    <td>${esc(b.created_at.slice(0, 16).replace("T", " "))}</td>
    <td><div class="acc"><a href="/emociones/#${esc(b.code)}" target="_blank" rel="noopener"><button type="button">Abrir</button></a>
    ${b.example ? "" : `<button type="button" class="d" data-del="${esc(b.code)}" data-name="${esc(b.name)}">Borrar</button>`}</div></td></tr>`).join("") || '<tr><td colspan="4">Todavía no hay equipos.</td></tr>';
}
$("f").addEventListener("submit", (e) => { e.preventDefault(); CLAVE = $("clave").value; cargar(); });
$("filas").addEventListener("click", (e) => {
  const b = e.target.closest("[data-del]"); if (!b) return;
  const code = b.dataset.del; $("dt").textContent = `Vas a borrar "${b.dataset.name}" y todos sus check-ins. Para confirmar escribí ${code}.`;
  $("dc").value = ""; $("dlg").dataset.code = code; $("dlg").showModal();
});
$("dlg").addEventListener("close", async () => {
  if ($("dlg").returnValue !== "ok") return;
  const code = $("dlg").dataset.code;
  if ($("dc").value.trim().toUpperCase() !== code) { msg("El código no coincide, no se borró nada."); return; }
  const r = await api("DELETE", "/boards/" + code);
  msg(r.ok ? "" : (r.j.error || "No se pudo borrar.")); cargar();
});
if (CLAVE) cargar();
</script>
</body>
</html>
