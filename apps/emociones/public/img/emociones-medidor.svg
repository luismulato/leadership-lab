<text x="76" y="140" font-size="17" font-weight="700" fill="#333">Alta energía · Desagradable</text>
<text x="496" y="140" font-size="17" font-weight="700" fill="#333">Alta energía · Agradable</text>
<text x="76" y="330" font-size="17" font-weight="700" fill="#333">Baja energía · Desagradable</text>
<text x="496" y="330" font-size="17" font-weight="700" fill="#333">Baja energía · Agradable</text>
<g font-size="15" fill="#555">
<text x="76" y="172">Enojado</text><text x="200" y="196">Ansioso</text><text x="96" y="224">Frustrado</text><text x="250" y="256">Tenso</text><text x="330" y="164">Abrumado</text>
<text x="496" y="172">Entusiasmado</text><text x="660" y="204">Curioso</text><text x="520" y="236">Motivado</text><text x="740" y="256">Alegre</text><text x="760" y="168">Inspirado</text>
<text x="76" y="362">Cansado</text><text x="220" y="390">Desanimado</text><text x="96" y="424">Triste</text><text x="300" y="446">Aburrido</text><text x="180" y="470">Apagado</text>
<text x="496" y="362">Tranquilo</text><text x="640" y="394">Sereno</text><text x="520" y="428">Relajado</text><text x="720" y="450">Satisfecho</text><text x="780" y="360">Aliviado</text>
