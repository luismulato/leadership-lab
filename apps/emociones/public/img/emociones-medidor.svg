<line x1="420" y1="14" x2="420" y2="72" stroke="#2b2b2b" stroke-opacity=".5"/>
<text x="442" y="38" font-size="15" fill="#1b1b1b">Una palabra para cómo llego hoy y la necesidad</text>
<text x="442" y="58" font-size="15" fill="#1b1b1b">que puede estar detrás, en cuatro cuadrantes</text>
<text x="442" y="78" font-size="15" fill="#1b1b1b">de energía y agrado.</text>
<rect x="60" y="112" width="420" height="190" fill="#e4e4e4"/>
