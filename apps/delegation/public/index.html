<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Delegation Poker en línea: un tablero compartido con las decisiones que tu organización está delegando, con las siete cartas de Management 3.0.">
<title>Delegation Poker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Gloock&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Estilo de la familia de apps del taller (tokens de Team Canvas). Las siete cartas conservan su forma y sus colores. */
:root {
  color-scheme: light;
  --bg: #EEF0F4; --fog: #DDE2EA; --surface: #F8F9FB; --surface-2: #FFFFFF;
  --ink: #1B2230; --ink-2: #4F596A; --ink-3: #5F6879; --line: #C9CFDA;
  --accent: #B3264B; --accent-ink: #FFFFFF; --accent-soft: #E6E9F0; --focus: #1B2230;
  --btn-bg: #1B2230; --btn-ink: #EEF0F4;
  --danger: #A3201F; --ok: #0C7A4F; --warn: #8F5400;
  /* cartas de Delegation Poker (fijas, son la marca del juego) */
  --l1: #F27EA8; --l2: #EF4136; --l3: #F58220; --l4: #DDB92B; --l5: #00B26B; --l6: #00B8E6; --l7: #8B73B8;
  --f-head: "Gloock", "Iowan Old Style", Georgia, serif;
  --f-card: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #12151D; --fog: #1C2230; --surface: #181C26; --surface-2: #1E2433; --ink: #E8EAF0; --ink-2: #A9B2C3; --ink-3: #9AA3B5;
    --line: #2D3446; --accent: #F0809D; --accent-ink: #1A0A10; --accent-soft: #1E2433; --focus: #E8EAF0;
    --btn-bg: #E8EAF0; --btn-ink: #12151D; --danger: #FF8A8A; --ok: #3DD598; --warn: #F2B04A;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12151D; --fog: #1C2230; --surface: #181C26; --surface-2: #1E2433; --ink: #E8EAF0; --ink-2: #A9B2C3; --ink-3: #9AA3B5;
  --line: #2D3446; --accent: #F0809D; --accent-ink: #1A0A10; --accent-soft: #1E2433; --focus: #E8EAF0;
  --btn-bg: #E8EAF0; --btn-ink: #12151D; --danger: #FF8A8A; --ok: #3DD598; --warn: #F2B04A;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.6 var(--f-body); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--f-head); font-weight: 400; text-wrap: balance; }
.mono { font-family: var(--f-mono); }
.muted { color: var(--ink-2); }
.eyebrow { font: 500 12px/1.3 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }

/* ---------- barra superior ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font: 400 22px/1 var(--f-head); }
.brand svg { display: block; flex: none; }
.org-chip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.org-name { font: 400 19px/1.1 var(--f-head); overflow-wrap: anywhere; }
.code-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 4px; background: var(--surface); border: 1.5px solid var(--line); font: 500 13px/1 var(--f-mono); letter-spacing: .08em; }
.code-btn:hover { border-color: var(--ink); }
.code-btn .cp { font: 500 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }

/* ---------- botones ---------- */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 4px;
  border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 600 15px/1 var(--f-body); transition: background-color .15s, color .15s, border-color .15s; }
.btn:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:disabled:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.ghost:hover { background: var(--ink); color: var(--bg); }
.btn.ghost:disabled:hover { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.danger:hover { background: var(--danger); border-color: var(--danger); color: var(--bg); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }

/* ---------- entrada ---------- */
.landing-band { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, var(--fog) 0%, var(--bg) 100%); border-bottom: 1px solid var(--line); }
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 40px; align-items: center; padding-block: 28px 36px; }
.hero h1 { font-size: clamp(2.4rem, 6.4vw, 4.6rem); line-height: 1; letter-spacing: -.01em; margin-top: 16px; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p.lead { font-size: clamp(1.05rem, 2vw, 1.25rem); line-height: 1.5; max-width: 38ch; color: var(--ink-2); margin: 18px 0 0; }
.panels { display: grid; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 4px; padding: 20px; }
.panel h2 { font-size: 1.5rem; line-height: 1.1; }
.panel p { margin: 6px 0 14px; color: var(--ink-2); font-size: 15px; line-height: 1.5; }
.inline-form { display: flex; gap: 10px; flex-wrap: wrap; }
.inline-form input { flex: 1 1 180px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font: 500 12px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
input[type=text], input[type=date], select, textarea { width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 4px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); }
input[type=text]:hover, input[type=date]:hover, select:hover, textarea:hover { border-color: var(--ink-3); }
textarea { min-height: 70px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--ink-3); }
input.code-input { font-family: var(--f-mono); letter-spacing: .14em; text-transform: uppercase; }
.err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 8px 0 0; }
.recent { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.recent button { min-height: 36px; padding: 6px 10px; border-radius: 4px; border: 1.5px solid var(--line); background: var(--surface-2); font-size: 13px; }
.recent button:hover { border-color: var(--ink); }
.what { padding-block: 44px 8px; display: grid; gap: 22px; }
.what h2 { font-size: clamp(1.7rem, 3.6vw, 2.3rem); line-height: 1.1; }
.what .lead { margin: 0; max-width: 62ch; color: var(--ink-2); }
.fan { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: clamp(6px, 1.4vw, 16px); padding-block: 8px 4px; }
.fan .pcw:nth-child(odd) { transform: translateY(10px); }
.levels { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.levels li { display: grid; grid-template-columns: 2.2em minmax(7.5em, 9em) minmax(0, 1fr); gap: 4px 14px; align-items: baseline; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.levels .n { font: 500 13px/1 var(--f-mono); color: var(--ink-2); }
.levels .nm { font: 400 1.2rem/1.2 var(--f-head); border-left: 6px solid var(--c); padding-left: 10px; }
.levels .sy { color: var(--ink-2); font-size: 15px; }
@media (max-width: 520px) { .levels li { grid-template-columns: 2em minmax(0, 1fr); } .levels .sy { grid-column: 2; } }
.credit { margin-top: 36px; font-size: 13px; color: var(--ink-2); text-align: center; }
.credit a { color: var(--ink); }
.credit a:hover { color: var(--accent); }

/* ---------- cartas Delegation Poker ---------- */
.pcw { display: block; container-type: inline-size; width: 100%; padding: 0; border: 0; background: none; text-align: inherit; }
.pc { position: relative; display: block; width: 100%; aspect-ratio: 5 / 7.2; background: var(--c); border-radius: 9cqw; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(0,0,0,.14), 0 8px 14px -10px rgba(0,0,0,.55); }
.pc-num { position: absolute; left: 8cqw; top: 3cqw; font: 800 30cqw/1 var(--f-card); color: #fff; }
.pc-av { position: absolute; right: 5cqw; top: 6cqw; height: 46cqw; display: flex; align-items: flex-end; gap: 1cqw; }
.pc-av svg { display: block; width: calc(var(--s) * 34cqw); height: auto; }
.pc-band { position: absolute; inset: 0; background: #fff; clip-path: polygon(0 56%, 100% 42%, 100% 68%, 0 82%); }
.pc-word { position: absolute; left: 0; right: 0; top: 63%; transform: translateY(-50%); text-align: center; font: 700 22cqw/1 var(--f-card); color: #111; }
.pc-bub { position: absolute; left: 14cqw; right: 14cqw; top: 82%; height: 13%; display: flex; align-items: center; justify-content: center;
  background: #111; color: #fff; border-radius: 3cqw; padding: 0 3cqw; text-align: center; font: 500 9.6cqw/1.08 var(--f-card); }
.pc-bub::before { content: ""; position: absolute; left: 14cqw; top: -3.2cqw; border: 3cqw solid transparent; border-bottom-color: #111; border-top: 0; }
@container (max-width: 104px) { .pc-bub { display: none; } .pc-word { top: 66%; font-size: 21cqw; } .pc-band { clip-path: polygon(0 56%, 100% 42%, 100% 82%, 0 96%); } }
.pc.back { background: #00B6E2; display: grid; place-items: center; }
.pc.back svg { width: 62cqw; height: auto; }
.pc.empty { background: transparent; box-shadow: none; border: 2px dashed var(--line); }
.pcw.flip .pc { animation: flip .38s cubic-bezier(.2,.7,.3,1); }
@keyframes flip { from { transform: rotateY(88deg) scale(.96); } to { transform: none; } }


/* mano de 7 cartas */
.hand-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; padding: 14px 6px 10px; }
.hand { transition: transform .15s ease, opacity .15s ease; opacity: 1; border-radius: 4px; }
.hand:hover { transform: translateY(-4px); }
.hand-row.has-sel .hand[aria-pressed="false"] { opacity: .5; }
.hand-row.has-sel .hand[aria-pressed="false"]:hover { opacity: 1; }
.hand[aria-pressed="true"] { transform: translateY(-10px); }
.hand[aria-pressed="true"] .pc { outline: 3px solid var(--ink); outline-offset: 3px; }
.pick-says { min-height: 24px; margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }
.pick-says b { color: var(--ink); font-weight: 600; }

/* ---------- mapa de niveles ---------- */
.map { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; margin-top: 8px; ; }
.map-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; margin-bottom: 14px; }
.map-head h2 { font-size: 24px;  }
.stats { font-size: 14px; color: var(--ink-2); }
.stats b { color: var(--ink); font-weight: 600; }
.lv-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.lv { display: flex; flex-direction: column; gap: 6px; padding: 0; border: 2px solid transparent; border-radius: 4px; background: var(--surface-2); text-align: left; overflow: hidden; }
.lv:hover { border-color: var(--line); }
.lv[aria-pressed="true"] { border-color: var(--ink); }
.lv-top { background: var(--c); color: #111; padding: 6px 8px; display: flex; align-items: baseline; gap: 6px; font: 700 15px/1 var(--f-card); }
.lv-top b { font-size: 26px; font-weight: 800; }
.lv-bars { display: flex; align-items: flex-end; gap: 6px; height: 54px; padding: 0 8px; }
.lv-bars i { flex: 1; background: var(--c); border-radius: 3px 3px 0 0; min-height: 3px; }
.lv-bars i.goal { background: repeating-linear-gradient(135deg, var(--c) 0 4px, transparent 4px 7px); box-shadow: inset 0 0 0 2px var(--c); }
.lv-nums { padding: 0 8px 8px; font: 500 12px/1.3 var(--f-mono); color: var(--ink-2); display: flex; justify-content: space-between; }
.map-key { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--ink-3); }
.map-key span::before { content: ""; display: inline-block; width: 14px; height: 10px; margin-right: 6px; border-radius: 2px; background: var(--ink-3); vertical-align: -1px; }
.map-key span.g::before { background: repeating-linear-gradient(135deg, var(--ink-3) 0 3px, transparent 3px 5px); box-shadow: inset 0 0 0 1.5px var(--ink-3); }

/* ---------- filtros ---------- */
.bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-top: 22px; }
.bar .field { flex: 1 1 150px; }
.bar .grow { flex: 2 1 220px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 42px; padding: 0 14px; border: 0; background: transparent; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-ink); }
.notice { margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.notice .mono { font-size: 20px; letter-spacing: .14em; }
.notice.warn { border-color: var(--warn); }

/* ---------- tablero ---------- */
.board-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 26px 0 10px; flex-wrap: wrap; }
.board-head h2 { font-size: 28px;  }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; ; overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 2.1fr) minmax(0, 1.3fr) 200px minmax(0, 1.2fr); gap: 20px; align-items: center; padding: 16px 20px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row[data-edit] { cursor: pointer; }
.row[data-edit]:hover { background: var(--surface-2); }
.r-title { font: 400 20px/1.15 var(--f-head); }
.r-meta { margin-top: 6px; font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; flex-wrap: wrap; }
.r-meta span + span::before { content: "·"; margin-right: 6px; color: var(--ink-3); }
.r-lead b { display: block; font-weight: 600; }
.r-lead span { font-size: 13px; color: var(--ink-2); }
.r-cards { display: flex; align-items: center; gap: 8px; }
.r-cards .col { width: 66px; text-align: center; }
.r-cards .cap { display: block; margin-top: 4px; font: 500 11px/1 var(--f-mono); letter-spacing: .1em;  color: var(--ink-3); }
.r-cards .arrow { flex: 1; text-align: center; color: var(--ink-3); font-size: 18px; padding-bottom: 14px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; font: 500 12px/1.2 var(--f-mono); letter-spacing: .04em; background: var(--surface-2); border: 1px solid var(--line); }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.pill.up::before { background: var(--l6); }
.pill.ok::before { background: var(--ok); }
.pill.warn::before { background: var(--warn); }
.pill.down::before { background: var(--l7); }
.r-when { margin-top: 6px; font-size: 13px; color: var(--ink-2); }
.r-when.late { color: var(--warn); font-weight: 600; }
/* matriz estilo Delegation Board */
.mx-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; ; }
.mx { min-width: 1060px; }
.mx-head, .mx-row { display: grid; grid-template-columns: 230px repeat(7, minmax(118px, 1fr)); position: relative; }
.mx-corner { grid-column: 1; grid-row: 1; padding: 16px 18px; align-self: end; }
.mx-hcell { grid-row: 1; padding: 14px 12px; border-left: 1px solid var(--line); background: color-mix(in srgb, var(--c) 12%, var(--surface)); }
.mx-hcell .pcw { width: min(100%, 96px); margin: 0 auto; }
.mx-row { border-top: 1px solid var(--line); }
.mx-row[data-edit] { cursor: pointer; }
.mx-label { grid-column: 1; grid-row: 1; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.mx-label .r-title { font-size: 17px; }
.mx-cell { grid-row: 1; border-left: 1px solid var(--line); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px;
  background: color-mix(in srgb, var(--c) 6%, var(--surface)); }
.mx-row:hover .mx-cell { background: color-mix(in srgb, var(--c) 12%, var(--surface)); }
.mx-card { width: 52px; margin-bottom: 6px; }
.mx-card.goal .pc { outline: 2px dashed var(--ink); outline-offset: 3px; }
.mx-name { font-size: 13px; font-weight: 600; line-height: 1.2; }
.mx-role { font-size: 11.5px; line-height: 1.25; color: var(--ink-2); }
.mx-date { display: flex; flex-direction: column; margin-top: 2px; font: 500 12px/1.25 var(--f-mono); }
.mx-date i { font: 500 10px/1.2 var(--f-mono); letter-spacing: .1em;  color: var(--ink-3); }
.mx-date.late { color: var(--warn); font-weight: 600; }
.mx-date.ok { color: var(--ok); }
.mx-line { grid-row: 1; position: relative; pointer-events: none; }
.mx-line::before { content: ""; position: absolute; top: 49px; left: calc(50% / var(--k) + 32px); right: calc(50% / var(--k) + 32px); border-top: 2px dashed var(--ink-2); }
.mx-line::after { content: ""; position: absolute; top: 43px; right: calc(50% / var(--k) + 32px); border: 7px solid transparent; border-right: 0; border-left: 10px solid var(--ink-2); }
.mx-line.rev::after { right: auto; left: calc(50% / var(--k) + 32px); border-left: 0; border-right: 10px solid var(--ink-2); }
.mx-key { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--ink-3); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; ; display: flex; flex-direction: column; gap: 14px; }
.tile[data-edit] { cursor: pointer; }
.tile[data-edit]:hover { border-color: var(--ink-3); }
.tile .r-cards .col { width: 104px; }
.tile .r-cards { justify-content: center; }
.empty-state { padding: 44px 24px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; }
.empty-state h3 { font-size: 26px;  }
.empty-state p { max-width: 52ch; margin: 8px auto 16px; color: var(--ink-2); }

/* ---------- hoja de decisión ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8,10,14,.62); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: 100%; max-width: 920px; background: var(--bg); border-radius: 8px 8px 0 0; margin-top: 12px; min-height: calc(100% - 12px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px 8px; }
.sheet-head h2 { font-size: 30px;  }
.x { width: 40px; height: 40px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; }
.sheet-body { padding: 8px 22px 24px; display: flex; flex-direction: column; gap: 22px; flex: 1; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; }
.step h3 { font-size: 20px;  margin-bottom: 4px; }
.step > p { margin: 0 0 14px; font-size: 14px; color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chips button { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 500; }
.chips button[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-ink); border-color: var(--btn-bg); }
.end-save { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 4px; }
.btn.big { min-height: 54px; padding: 0 28px; font-size: 20px; }
.sheet-foot { position: sticky; bottom: 0; z-index: 2; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 22px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line); }
.foot-cards { display: flex; align-items: center; gap: 10px; }
.foot-cards .pcw { width: 46px; }
.foot-cards .pcw .pc { border-radius: 6px; }
.foot-gap { font-size: 14px; color: var(--ink-2); flex: 1 1 180px; }

.foot-actions { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 99; background: var(--btn-bg); color: var(--btn-ink);
  padding: 10px 16px; border-radius: 4px; font-weight: 600; max-width: calc(100% - 32px); }

@media (max-width: 860px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .row { grid-template-columns: minmax(0, 1fr) auto; gap: 12px 16px; }
  .row .r-title-col, .row .r-when-col { grid-column: 1 / -1; }
  .r-cards { grid-column: 2; grid-row: 2; }
  .r-lead { grid-column: 1; grid-row: 2; }
  .row .r-when-col { grid-row: 3; }
  .lv-strip { grid-template-columns: repeat(7, 86px); overflow-x: auto; padding-bottom: 6px; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .hand-row { grid-template-columns: repeat(7, 92px); overflow-x: auto; padding-top: 18px; }
  .sheet { border-radius: 0; margin-top: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .hand, .pcw.flip .pc { transition: none; animation: none; }
}

<body>

  <defs>

      <ellipse cx="50" cy="68" rx="27" ry="28" fill="#F7A8C4" stroke="#111" stroke-width="4"/>

      <rect x="13" y="53" width="74" height="9" rx="4.5" fill="#9FD9F6" stroke="#111" stroke-width="4"/>

      <circle cx="39" cy="74" r="5.5" fill="#111"/><circle cx="39" cy="74" r="2.4" fill="#2BB6D8"/>

        <circle cx="26" cy="38" r="13"/><circle cx="40" cy="26" r="14"/><circle cx="58" cy="24" r="14"/><circle cx="74" cy="36" r="13"/>
      </g>
      <path d="M23 52c0-6 5-12 12-12h30c7 0 12 6 12 12v28c0 12-10 22-27 22S23 92 23 80z" fill="#FFAA1D" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
      <path d="M26 46c10-4 36-4 48 0" fill="none" stroke="#A9492B" stroke-width="9" stroke-linecap="round"/>
      <circle cx="39" cy="68" r="5.5" fill="#111"/><circle cx="39" cy="68" r="2.4" fill="#2BB6D8"/>
      <circle cx="61" cy="68" r="5.5" fill="#111"/><circle cx="61" cy="68" r="2.4" fill="#2BB6D8"/>
      <path d="M50 70l-4.5 9h9z" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <path d="M39 87q11 8 22 0" fill="none" stroke="#111" stroke-width="3.4" stroke-linecap="round"/>

</svg>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand" id="brand"></div>
    <div class="org-chip" id="orgChip" hidden></div>
  </header>
  <main id="view"></main>
  <p class="credit">Delegation Poker es una práctica de <a href="https://management30.com/practice/delegation-poker/" target="_blank" rel="noopener noreferrer">Management 3.0</a>. Las siete cartas y sus textos son de ellos; esta app las usa para registrar decisiones reales.<br>Hecho por <a href="https://www.linkedin.com/in/luismulato/" target="_blank" rel="noopener noreferrer">Luis Mulato</a>.</p>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  /* ---------- datos de las siete cartas ---------- */
  var LEVELS = [
    { n: 1, name: 'Decir',     say: 'Yo se lo diré',                     color: 'var(--l1)', sc: [1, 0] },
    { n: 2, name: 'Vender',    say: 'Yo intentaré vendérselo',           color: 'var(--l2)', sc: [1, .55] },
    { n: 3, name: 'Consultar', say: 'Yo lo consultaré y luego decidiré', color: 'var(--l3)', sc: [.92, .86] },
    { n: 4, name: 'Acordar',   say: 'Lo acordaremos juntos',             color: 'var(--l4)', sc: [.86, .86] },
    { n: 5, name: 'Aconsejar', say: 'Yo les aconsejaré pero ellos deciden', color: 'var(--l5)', sc: [.66, .92] },
    { n: 6, name: 'Preguntar', say: 'Yo preguntaré después de que ellos decidan', color: 'var(--l6)', sc: [.5, 1] },
    { n: 7, name: 'Delegar',   say: 'Yo delegaré completamente',         color: 'var(--l7)', sc: [0, 1.05] }
  ];
  var EJEMPLO_CODE = 'ACME01';

  /* ---------- utilidades ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function isoDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseISO(s) { return new Date(s + 'T00:00:00'); }
  function today() { return isoDate(new Date()); }
  function addMonths(iso, n) {
    var d = parseISO(iso), day = d.getDate();
    var t = new Date(d.getFullYear(), d.getMonth() + n, 1);
    var last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    t.setDate(Math.min(day, last));
    return isoDate(t);
  }
  function fmtDate(iso) { return iso ? parseISO(iso).toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'; }
  function daysTo(iso) { return Math.round((parseISO(iso) - parseISO(today())) / 86400000); }
  function normCode(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function showCode(c) { return c.length > 3 ? c.slice(0, 3) + '-' + c.slice(3) : c; }
  function genCode() {
    var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', out = '';
    var buf = new Uint32Array(6);
    (window.crypto || window.msCrypto).getRandomValues(buf);
    for (var i = 0; i < 6; i++) out += a[buf[i] % a.length];
    return out;
  }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }
  function copy(text, okMsg) {
    var done = function () { toast(okMsg); };
    try { navigator.clipboard.writeText(text).then(done, function () { toast('Selecciona y copia: ' + text); }); }
    catch (e) { toast('Selecciona y copia: ' + text); }
  }

  /* ---------- piezas visuales ---------- */
  function compass(size) {
    var cx = 50, cy = 50, r = 45, n = 7, paths = '';
    function pt(a, rad) { return [cx + rad * Math.cos(a), cy + rad * Math.sin(a)]; }
    for (var i = 0; i < n; i++) {
      var a0 = -Math.PI / 2 + (i - .5) * 2 * Math.PI / n, a1 = a0 + 2 * Math.PI / n;
      var p0 = pt(a0, r), p1 = pt(a1, r);
      paths += '<path d="M50 50L' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) + 'A' + r + ' ' + r + ' 0 0 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) + 'Z" fill="' + LEVELS[i].color + '" stroke="#111" stroke-width="3" stroke-linejoin="round"/>';
    }
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 100" aria-hidden="true">' + paths +
      '<circle cx="50" cy="50" r="15" fill="#fff" stroke="#111" stroke-width="3.5"/>' +
      '<path d="M50 38l7 16-7-4-7 4z" fill="#111" transform="rotate(35 50 50)"/></svg>';
  }
  function card(lv, flip) {
    var L = LEVELS[lv - 1];
    var av = '';
    if (L.sc[0]) av += '<svg viewBox="0 0 100 112" style="--s:' + L.sc[0] + '"><use href="#av-m"/></svg>';
    if (L.sc[1]) av += '<svg viewBox="0 0 100 112" style="--s:' + L.sc[1] + '"><use href="#av-w"/></svg>';
    return '<span class="pcw' + (flip ? ' flip' : '') + '"><span class="pc" style="--c:' + L.color + '">' +
      '<span class="pc-num">' + L.n + '</span><span class="pc-av">' + av + '</span><span class="pc-band"></span>' +
      '<span class="pc-word">' + L.name + '</span><span class="pc-bub">' + esc(L.say) + '</span></span></span>';
  }
  function cardBack() {
    return '<span class="pcw"><span class="pc back">' + compass(100) + '</span></span>';
  }
  function cardSlot() { return '<span class="pcw"><span class="pc empty"></span></span>'; }

  /* ---------- capa de datos: API propia (/api) sobre D1 ---------- */
  var writeSeq = 0;
  function api(method, path, body) {
    return fetch('/delegation/api' + path, { method: method, headers: body ? { 'content-type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) { var e = new Error(j.error || 'No se pudo completar la acción.'); e.status = r.status; throw e; }
          return j;
        });
      });
  }
  function newId() {
    var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', out = '', buf = new Uint32Array(9);
    window.crypto.getRandomValues(buf);
    for (var i = 0; i < 9; i++) out += a[buf[i] % a.length];
    return out;
  }
  function write(method, path, body) {
    writeSeq++;
    return api(method, path, body).then(function (r) { writeSeq++; return r; }, function (e) { writeSeq++; throw e; });
  }
  var DB = {
    getOrg: function (code) {
      return api('GET', '/orgs/' + code).catch(function (e) { if (e.status === 404) return null; throw e; });
    },
    createOrg: function (code, name) { return api('POST', '/orgs', { code: code, name: name }); },
    saveDecision: function (code, id, data) { return write('PUT', '/orgs/' + code + '/decisions/' + id, data); },
    removeDecision: function (code, id) { return write('DELETE', '/orgs/' + code + '/decisions/' + id); },
    /* Sondeo cada 4 s (15 s con la pestaña oculta). Devuelve la función para detenerlo. */
    watch: function (code, next, onErr) {
      var stop = false, timer = null, last = null;
      function tick() {
        if (stop) return;
        var seq = writeSeq;
        api('GET', '/orgs/' + code + '/decisions').then(function (r) {
          if (stop || seq !== writeSeq) return;
          var s = JSON.stringify(r.decisions);
          if (s !== last) { last = s; next(r.decisions); }
        }).catch(function (e) { if (onErr && !stop) onErr(e); })
          .then(function () { if (!stop) timer = setTimeout(tick, document.hidden ? 15000 : 4000); });
      }
      tick();
      return function () { stop = true; clearTimeout(timer); };
    }
  };

  /* ---------- estado ---------- */
  var S = {
    canWrite: true,
    org: null, decisions: [], pending: {}, unsub: null, loadTimer: null, loaded: false,
    f: { area: '', team: '', leader: '', level: 0, q: '' }, view: 'matrix', created: false
  };

  /* ---------- cabecera ---------- */
  $('brand').innerHTML = compass(32) + '<span>Delegation Poker</span>';
  function renderChip() {
    var el = $('orgChip');
    if (!S.org) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    el.innerHTML = '<button class="btn ghost sm" data-act="copy-code" title="Copiar el código para compartir el tablero">Copiar código</button>' +
      '<button class="btn ghost sm" data-act="leave">Cambiar</button>';
  }

  /* ---------- entrada ---------- */
  function renderLanding(msg) {
    S.org = null; renderChip();
    var fan = LEVELS.map(function (l) { return card(l.n); }).join('');
    var rows = LEVELS.map(function (l) {
      return '<li style="--c:' + l.color + '"><span class="n">' + l.n + '</span><span class="nm">' + esc(l.name) + '</span><span class="sy">' + esc(l.say) + '</span></li>';
    }).join('');
    $('view').innerHTML =
      '<div class="landing-band"><section class="hero">' +
        '<div><p class="eyebrow">Management 3.0 · Delegation Poker</p>' +
        '<h1>Quién decide qué, <em>y hasta dónde</em></h1>' +
        '<p class="lead">Un tablero compartido con las decisiones que tu organización está delegando. Cada una lleva su carta de hoy, su carta objetivo y un plazo.</p></div>' +
        '<div class="panels">' +
          '<form class="panel" id="formCreate" autocomplete="off">' +
            '<h2>Crear organización</h2><p>Ponle nombre y recibe un código para volver siempre a este tablero.</p>' +
            '<div class="inline-form"><input type="text" id="orgName" maxlength="60" placeholder="Nombre de la organización" aria-label="Nombre de la organización">' +
            '<button class="btn" type="submit" id="btnCreate">Crear</button></div>' +
          '</form>' +
          '<form class="panel" id="formJoin" autocomplete="off">' +
            '<h2>Entrar con código</h2><p>Si alguien de tu equipo ya creó el tablero, pega su código. El código es la llave: quien lo tiene puede ver y editar el tablero.</p>' +
            '<div class="inline-form"><input type="text" class="code-input" id="orgCode" maxlength="8" placeholder="ABC-123" aria-label="Código de la organización">' +
            '<button class="btn ghost" type="submit" id="btnJoin">Entrar</button></div>' +
            '<p class="err" id="landErr" role="alert">' + esc(msg || '') + '</p>' +
            '<p style="margin:0;font-size:14px">¿Solo quieres ver cómo funciona? <button class="btn ghost sm" type="button" data-act="open-demo">Abrir el ejemplo de ACME</button></p>' +
          '</form>' +
        '</div>' +
      '</section></div>' +
      '<section class="what" aria-labelledby="whatT"><div><p class="eyebrow">La práctica</p><h2 id="whatT">Qué es Delegation Poker</h2></div>' +
        '<p class="lead">Es una práctica de Management 3.0 para ponerse de acuerdo sobre quién decide qué. Cada decisión se ubica en una de siete cartas, desde la 1, donde la persona con autoridad decide y avisa, hasta la 7, donde el equipo decide solo. Elige dónde está cada decisión hoy y dónde quieres que esté.</p>' +
        '<div class="fan" aria-hidden="true">' + fan + '</div>' +
        '<ol class="levels" aria-label="Los siete niveles de delegación">' + rows + '</ol>' +
      '</section>';
    $('formCreate').addEventListener('submit', function (e) { e.preventDefault(); createOrg(); });
    $('formJoin').addEventListener('submit', function (e) { e.preventDefault(); enterOrg($('orgCode').value); });
  }
  function landErr(m) { var el = $('landErr'); if (el) el.textContent = m || ''; }

  async function createOrg() {
    var name = $('orgName').value.trim();
    if (name.length < 2) { landErr('Escribe el nombre de la organización (mínimo 2 letras).'); $('orgName').focus(); return; }
    $('btnCreate').disabled = true; landErr('');
    try {
      var r = await DB.createOrg(genCode(), name);
      var code = r.code;
      S.created = true;
      await enterOrg(code, name);
    } catch (e) {
      landErr(dbMsg(e));
      var b = $('btnCreate'); if (b) b.disabled = false;
    }
  }
  function dbMsg(e) {
    if (e && e.status === 403) return 'Este tablero es de solo lectura.';
    if (e instanceof TypeError) return 'No pude conectar con el servidor. Revisa tu conexión e intenta de nuevo.';
    return (e && e.message) || 'No se pudo completar la acción.';
  }

  async function enterOrg(raw, knownName) {
    var code = normCode(raw);
    if (code.length < 4) { landErr('El código tiene al menos 4 caracteres.'); return; }
    landErr('');
    try {
      var info = await DB.getOrg(code);
      if (!info) { S.created = false; landErr('No existe una organización con ese código. Revisa que esté bien escrito.'); return; }
      S.org = { code: code, name: knownName || info.name || code };
      S.canWrite = !info.readonly;
    } catch (e) { landErr(dbMsg(e)); return; }
    S.f = { area: '', team: '', leader: '', level: 0, q: '' };
    S.decisions = []; S.pending = {}; S.loaded = false;
    renderChip(); renderBoardShell(); subscribe();
  }

  function leaveOrg() {
    if (S.unsub) { S.unsub(); S.unsub = null; }
    clearTimeout(S.loadTimer);
    S.org = null; S.created = false; S.decisions = [];
    closeSheet();
    if (location.hash) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
    renderLanding();
  }

  function subscribe() {
    if (S.unsub) S.unsub();
    clearTimeout(S.loadTimer);
    S.loadTimer = setTimeout(function () {
      if (!S.loaded) { var l = $('list'); if (l) l.innerHTML = '<div class="empty-state"><h3>Sin respuesta todavía</h3><p>No se pudo alcanzar el servidor. Sigue intentando de fondo; no hace falta recargar.</p></div>'; }
    }, 10000);
    S.unsub = DB.watch(S.org.code, function (docs) {
      var have = {};
      S.decisions = docs.map(function (x) { have[x.id] = 1; return x; });
      Object.keys(S.pending).forEach(function (id) {
        if (!have[id]) S.decisions.push(S.pending[id]);
        else S.decisions = S.decisions.map(function (x) { return x.id === id ? S.pending[id] : x; });
      });
      S.loaded = true; clearTimeout(S.loadTimer);
      renderBoard();
    }, function (e) {
      clearTimeout(S.loadTimer);
      if (S.loaded) return;
      var l = $('list'); if (l) l.innerHTML = '<div class="empty-state"><h3>No se pudo leer el tablero</h3><p>' + esc(dbMsg(e)) + '</p></div>';
    });
  }

  /* ---------- tablero ---------- */
  function renderBoardShell() {
    $('view').innerHTML =
      '<div id="notice"></div>' +
      '<section class="map" aria-labelledby="mapT"><div class="map-head"><h2 id="mapT">Mapa de niveles</h2><div class="stats" id="stats"></div></div>' +
        '<div class="lv-strip" id="strip"></div>' +
        '<div class="map-key"><span>Decisiones hoy en ese nivel</span><span class="g">Meta: decisiones que quieren llegar a ese nivel</span><span style="margin-left:auto">Toca un nivel para filtrar</span></div></section>' +
      '<div class="bar">' +
        '<label class="field grow"><span>Buscar</span><input type="text" id="fq" placeholder="Decisión, persona o nota" autocomplete="off"></label>' +
        '<label class="field"><span>Área</span><select id="fArea"></select></label>' +
        '<label class="field"><span>Equipo</span><select id="fTeam"></select></label>' +
        '<label class="field"><span>Líder</span><select id="fLeader"></select></label>' +
        '<button class="btn ghost" data-act="clear">Limpiar</button>' +
      '</div>' +
      '<div class="board-head"><h2 id="boardT">Decisiones</h2>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">' +
          '<div class="seg" role="group" aria-label="Vista"><button data-act="view" data-v="matrix" aria-pressed="' + (S.view === 'matrix') + '">Matriz</button><button data-act="view" data-v="list" aria-pressed="' + (S.view === 'list') + '">Lista</button><button data-act="view" data-v="tiles" aria-pressed="' + (S.view === 'tiles') + '">Mesa</button></div>' +
          '<button class="btn" data-act="new" id="btnNew">Nueva decisión</button></div></div>' +
      '<div id="list"></div>';
    $('fq').addEventListener('input', function (e) { S.f.q = e.target.value.trim().toLowerCase(); renderBoard(true); });
    ['fArea:area', 'fTeam:team', 'fLeader:leader'].forEach(function (p) {
      var id = p.split(':')[0], key = p.split(':')[1];
      $(id).addEventListener('change', function (e) { S.f[key] = e.target.value; renderBoard(); });
    });
    var list = $('list'); list.innerHTML = '<div class="empty-state"><p>Cargando decisiones…</p></div>';
    renderNotice();
  }
  function renderNotice() {
    var n = $('notice'); if (!n) return;
    var html = '';
    if (S.created) {
      html += '<div class="notice"><div><b>Organización creada.</b> Usa «Copiar código» para que otras personas entren al mismo tablero.</div>' +
        '<button class="btn sm" data-act="copy-code">Copiar código</button><button class="btn ghost sm" data-act="dismiss-created">Entendido</button></div>';
    }
    if (!S.canWrite) html += '<div class="notice warn"><div><b>Ejemplo ficticio de ACME. Es de solo lectura.</b> ACME es una empresa inventada; puedes recorrer y filtrar el tablero de su equipo de Experiencia Cliente.</div><button class="btn sm" data-act="build-mine">Armar la mía</button></div>';
    n.innerHTML = html;
  }

  function uniq(key) {
    var s = {}; S.decisions.forEach(function (d) { if (d[key]) s[d[key]] = 1; });
    return Object.keys(s).sort(function (a, b) { return a.localeCompare(b, 'es'); });
  }
  function fillSelect(id, label, key, cur) {
    var el = $(id); if (!el) return;
    var vals = uniq(key);
    if (cur && vals.indexOf(cur) < 0) { S.f[({ fArea: 'area', fTeam: 'team', fLeader: 'leader' })[id]] = ''; cur = ''; }
    el.innerHTML = '<option value="">' + label + '</option>' + vals.map(function (v) { return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('');
  }
  function status(d) {
    if (d.current === d.desired) return { cls: 'ok', txt: 'En el nivel deseado', late: false, order: 3 };
    var late = d.targetDate && daysTo(d.targetDate) < 0;
    if (d.desired > d.current) return { cls: late ? 'warn' : 'up', txt: late ? 'Vencida · delegando' : 'Delegando más', late: late, order: late ? 0 : 1 };
    return { cls: late ? 'warn' : 'down', txt: late ? 'Vencida · recentralizando' : 'Recentralizando', late: late, order: late ? 0 : 2 };
  }
  function whenText(d) {
    if (!d.targetDate) return '';
    var n = daysTo(d.targetDate);
    var rel;
    if (d.current === d.desired) rel = 'desde ' + fmtDate(d.targetDate);
    else if (n < 0) rel = 'venció hace ' + (-n === 1 ? '1 día' : -n + ' días');
    else if (n === 0) rel = 'vence hoy';
    else if (n <= 45) rel = 'faltan ' + n + (n === 1 ? ' día' : ' días');
    else { var m = Math.round(n / 30.4); rel = 'faltan ' + m + (m === 1 ? ' mes' : ' meses'); }
    return 'Plazo ' + fmtDate(d.targetDate) + ' · ' + rel;
  }
  function pass(d, skipLevel) {
    var f = S.f;
    if (f.area && d.area !== f.area) return false;
    if (f.team && d.team !== f.team) return false;
    if (f.leader && d.leaderName !== f.leader) return false;
    if (!skipLevel && f.level && d.current !== f.level) return false;
    if (f.q && ([d.title, d.leaderName, d.leaderRole, d.area, d.team, d.note].join(' ').toLowerCase().indexOf(f.q) < 0)) return false;
    return true;
  }

  function renderBoard(keepFocus) {
    if (!S.org || !$('list')) return;
    fillSelect('fArea', 'Todas las áreas', 'area', S.f.area);
    fillSelect('fTeam', 'Todos los equipos', 'team', S.f.team);
    fillSelect('fLeader', 'Todos los líderes', 'leaderName', S.f.leader);
    var base = S.decisions.filter(function (d) { return pass(d, true); });
    var rows = base.filter(function (d) { return !S.f.level || d.current === S.f.level; });
    rows.sort(function (a, b) {
      var sa = status(a), sb = status(b);
      if (sa.order !== sb.order) return sa.order - sb.order;
      return String(a.targetDate || '9999').localeCompare(String(b.targetDate || '9999')) || String(a.title).localeCompare(String(b.title), 'es');
    });

    /* mapa */
    var hoy = [0, 0, 0, 0, 0, 0, 0, 0], meta = [0, 0, 0, 0, 0, 0, 0, 0], max = 1;
    base.forEach(function (d) { hoy[d.current]++; meta[d.desired]++; });
    for (var i = 1; i <= 7; i++) max = Math.max(max, hoy[i], meta[i]);
    $('strip').innerHTML = LEVELS.map(function (L) {
      var i = L.n;
      return '<button class="lv" style="--c:' + L.color + '" data-act="level" data-lv="' + i + '" aria-pressed="' + (S.f.level === i) + '" aria-label="Nivel ' + i + ' ' + L.name + ': ' + hoy[i] + ' hoy, ' + meta[i] + ' como meta">' +
        '<span class="lv-top"><b>' + i + '</b>' + L.name + '</span>' +
        '<span class="lv-bars"><i style="height:' + (hoy[i] ? Math.max(8, hoy[i] / max * 100) : 0) + '%"></i><i class="goal" style="height:' + (meta[i] ? Math.max(8, meta[i] / max * 100) : 0) + '%"></i></span>' +
        '<span class="lv-nums"><span>' + hoy[i] + '</span><span>' + meta[i] + '</span></span></button>';
    }).join('');
    var moving = base.filter(function (d) { return d.current !== d.desired; }).length;
    var late = base.filter(function (d) { return status(d).late; }).length;
    $('stats').innerHTML = '<b>' + base.length + '</b> ' + (base.length === 1 ? 'decisión' : 'decisiones') + ' · <b>' + moving + '</b> en movimiento · <b>' + late + '</b> ' + (late === 1 ? 'vencida' : 'vencidas');
    $('boardT').textContent = 'Decisiones' + (rows.length !== S.decisions.length ? ' (' + rows.length + ' de ' + S.decisions.length + ')' : '');
    var nb = $('btnNew'); if (nb) nb.hidden = !S.canWrite;

    /* lista o mesa */
    var el = $('list');
    if (!S.loaded) return;
    if (!S.decisions.length) {
      el.innerHTML = '<div class="empty-state"><h3>Aún no hay decisiones</h3><p>Registra la primera: qué se decide, quién tiene la autoridad hoy, en qué carta está y en cuál quieres que esté, con un plazo.</p>' +
        (S.canWrite ? '<button class="btn" data-act="new">Registrar la primera decisión</button>' : '') + '</div>';
      return;
    }
    if (!rows.length) {
      el.innerHTML = '<div class="empty-state"><h3>Nada con estos filtros</h3><p>Ninguna decisión coincide. Quita algún filtro para ver más.</p><button class="btn ghost" data-act="clear">Limpiar filtros</button></div>';
      return;
    }
    var edit = S.canWrite ? function (d) { return ' data-edit="' + esc(d.id) + '" tabindex="0" role="button" aria-label="Editar: ' + esc(d.title) + '"'; } : function () { return ''; };
    function pair(d) {
      return '<div class="r-cards"><div class="col">' + card(d.current) + '<span class="cap">Hoy</span></div><span class="arrow" aria-hidden="true">→</span><div class="col">' + card(d.desired) + '<span class="cap">Meta</span></div></div>';
    }
    if (S.view === 'matrix') {
      el.className = '';
      var head = '<div class="mx-head"><div class="mx-corner"><span class="eyebrow">Decisión</span></div>' +
        LEVELS.map(function (L) { return '<div class="mx-hcell" style="--c:' + L.color + ';grid-column:' + (L.n + 1) + '">' + card(L.n) + '</div>'; }).join('') + '</div>';
      var body = rows.map(function (d) {
        var st = status(d), same = d.current === d.desired, k = Math.abs(d.desired - d.current) + 1;
        var cells = LEVELS.map(function (L) {
          var inner = '';
          if (L.n === d.current) {
            inner = '<div class="mx-card">' + card(d.current) + '</div><b class="mx-name">' + esc(d.leaderName) + '</b><span class="mx-role">' + esc(d.leaderRole || '') + '</span>' +
              (same ? '<span class="mx-date ok"><i>Meta</i>alcanzada</span>' : '');
          } else if (L.n === d.desired) {
            inner = '<div class="mx-card goal">' + card(d.desired) + '</div><span class="mx-date' + (st.late ? ' late' : '') + '"><i>Meta</i>' + esc(fmtDate(d.targetDate)) + '</span>';
          }
          return '<div class="mx-cell" style="--c:' + L.color + ';grid-column:' + (L.n + 1) + '">' + inner + '</div>';
        }).join('');
        var line = same ? '' : '<span class="mx-line' + (d.desired < d.current ? ' rev' : '') + '" style="grid-column:' + (Math.min(d.current, d.desired) + 1) + ' / span ' + k + ';--k:' + k + '"></span>';
        return '<article class="mx-row"' + edit(d) + '><div class="mx-label"><div class="r-title">' + esc(d.title) + '</div>' +
          '<div class="r-meta">' + (d.area ? '<span>' + esc(d.area) + '</span>' : '') + (d.team ? '<span>' + esc(d.team) + '</span>' : '') + '</div>' +
          '<div><span class="pill ' + st.cls + '">' + st.txt + '</span></div></div>' + cells + line + '</article>';
      }).join('');
      el.innerHTML = '<div class="mx-scroll"><div class="mx">' + head + body + '</div></div>' +
        '<div class="mx-key"><span>Carta sólida: dónde está hoy, con su líder</span><span>Carta punteada: nivel deseado, con su fecha</span><span>La flecha marca el recorrido</span></div>';
    } else if (S.view === 'tiles') {
      el.className = 'tiles';
      el.innerHTML = rows.map(function (d) {
        var st = status(d);
        return '<article class="tile"' + edit(d) + '><div><div class="r-title">' + esc(d.title) + '</div><div class="r-meta">' + (d.area ? '<span>' + esc(d.area) + '</span>' : '') + (d.team ? '<span>' + esc(d.team) + '</span>' : '') + '</div></div>' +
          pair(d) +
          '<div class="r-lead"><b>' + esc(d.leaderName) + '</b><span>' + esc(d.leaderRole || '') + '</span></div>' +
          '<div><span class="pill ' + st.cls + '">' + st.txt + '</span><div class="r-when' + (st.late ? ' late' : '') + '">' + esc(whenText(d)) + '</div></div></article>';
      }).join('');
    } else {
      el.className = 'list';
      el.innerHTML = rows.map(function (d) {
        var st = status(d);
        return '<article class="row"' + edit(d) + '>' +
          '<div class="r-title-col"><div class="r-title">' + esc(d.title) + '</div><div class="r-meta">' + (d.area ? '<span>' + esc(d.area) + '</span>' : '') + (d.team ? '<span>' + esc(d.team) + '</span>' : '') + '</div></div>' +
          '<div class="r-lead"><b>' + esc(d.leaderName) + '</b><span>' + esc(d.leaderRole || '') + '</span></div>' +
          pair(d) +
          '<div class="r-when-col"><span class="pill ' + st.cls + '">' + st.txt + '</span><div class="r-when' + (st.late ? ' late' : '') + '">' + esc(whenText(d)) + '</div></div></article>';
      }).join('');
    }
  }

  /* ---------- hoja: nueva / editar decisión ---------- */
  var F = null; // formulario en curso
  function openSheet(id) {
    if (!S.canWrite) return;
    var d = id ? S.decisions.filter(function (x) { return x.id === id; })[0] : null;
    var t = today();
    F = d ? { id: d.id, current: d.current, desired: d.desired, startDate: d.startDate || t, confirmDel: false, saving: false }
          : { id: null, current: 0, desired: 0, startDate: t, confirmDel: false, saving: false };
    var v = d || { title: '', area: '', team: '', leaderName: '', leaderRole: '', targetDate: addMonths(t, 3), note: '' };
    function dl(id, key) { return '<datalist id="' + id + '">' + uniq(key).map(function (x) { return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>'; }
    var ov = $('overlay');
    ov.hidden = false;
    ov.innerHTML =
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">' +
        '<div class="sheet-head"><h2 id="sheetT">' + (d ? 'Editar decisión' : 'Nueva decisión') + '</h2><button class="x" data-act="close" aria-label="Cerrar">&times;</button></div>' +
        '<div class="sheet-body">' +
          '<section class="step"><h3>La decisión</h3><p>Qué se decide y en qué parte de la organización vive.</p>' +
            '<label class="field" style="margin-bottom:14px"><span>Decisión</span><input type="text" id="fTitle" maxlength="120" value="' + esc(v.title) + '" placeholder="Ej.: Aprobar descuentos a clientes"></label>' +
            '<div class="grid2"><label class="field"><span>Área</span><input type="text" id="fAreaIn" list="dlArea" maxlength="60" value="' + esc(v.area) + '" placeholder="Ej.: Comercial"></label>' +
            '<label class="field"><span>Equipo</span><input type="text" id="fTeamIn" list="dlTeam" maxlength="60" value="' + esc(v.team) + '" placeholder="Ej.: Ventas Cono Sur"></label></div>' +
            dl('dlArea', 'area') + dl('dlTeam', 'team') + dl('dlName', 'leaderName') + dl('dlRole', 'leaderRole') +
          '</section>' +
          '<section class="step"><h3>Persona con autoridad</h3><p>Quien hoy tiene la última palabra. Las cartas hablan desde su voz: “Yo se lo diré”.</p>' +
            '<div class="grid2"><label class="field"><span>Nombre</span><input type="text" id="fName" list="dlName" maxlength="80" value="' + esc(v.leaderName) + '" placeholder="Ej.: Marta Ríos"></label>' +
            '<label class="field"><span>Cargo</span><input type="text" id="fRole" list="dlRole" maxlength="80" value="' + esc(v.leaderRole) + '" placeholder="Ej.: Gerenta comercial"></label></div>' +
          '</section>' +
          '<section class="step"><h3>Nivel de hoy</h3><p>Elige la carta que describe cómo se decide ahora, tal como en la mesa de Delegation Poker.</p>' +
            '<div class="hand-row" id="handNow" role="group" aria-label="Nivel actual"></div><p class="pick-says" id="saysNow"></p></section>' +
          '<section class="step"><h3>Nivel deseado y plazo</h3><p>Hacia qué carta quieres mover la decisión y en cuánto tiempo.</p>' +
            '<div class="hand-row" id="handGoal" role="group" aria-label="Nivel deseado"></div><p class="pick-says" id="saysGoal"></p>' +
            '<div class="chips" id="chips" role="group" aria-label="Plazo"></div>' +
            '<div class="grid2"><label class="field"><span>Fecha objetivo</span><input type="date" id="fDate" value="' + esc(v.targetDate) + '"></label>' +
            '<label class="field"><span>Nota (opcional)</span><textarea id="fNote" maxlength="400" placeholder="Condiciones, riesgos, qué falta para delegar">' + esc(v.note) + '</textarea></label></div>' +
          '</section>' +
          '<p class="err" id="formErr" role="alert"></p>' +
          '<div class="end-save"><button class="btn big" data-act="save">' + (d ? 'Guardar cambios' : 'Agregar al tablero') + '</button>' +
          '<span class="muted">' + (d ? 'Los cambios se ven al instante en el tablero.' : 'La decisión aparece en el tablero para toda la organización.') + '</span></div>' +
        '</div>' +
        '<div class="sheet-foot"><div class="foot-cards" id="footCards"></div><div class="foot-gap" id="footGap"></div>' +
          '<div class="foot-actions">' + (d ? '<button class="btn danger" data-act="delete" id="btnDel">Eliminar</button>' : '') +
          '<button class="btn ghost" data-act="close">Cancelar</button><button class="btn" data-act="save" id="btnSave">' + (d ? 'Guardar cambios' : 'Agregar al tablero') + '</button></div></div>' +
      '</div>';
    paintHands(false);
    paintChips();
    $('fDate').addEventListener('input', paintChips);
    setTimeout(function () { var t = $('fTitle'); if (t) t.focus(); }, 30);
  }
  function closeSheet() { var ov = $('overlay'); ov.hidden = true; ov.innerHTML = ''; F = null; }

  function handHtml(sel, which) {
    return LEVELS.map(function (L) {
      return '<button type="button" class="pcw hand" data-act="pick" data-which="' + which + '" data-lv="' + L.n + '" aria-pressed="' + (sel === L.n) + '" aria-label="Nivel ' + L.n + ' ' + L.name + ': ' + esc(L.say) + '">' + card(L.n).replace('<span class="pcw">', '<span style="display:block;width:100%">').replace(/<\/span>$/, '</span>') + '</button>';
    }).join('');
  }
  function paintHands(flip) {
    if (!F) return;
    var a = $('handNow'), b = $('handGoal'); if (!a) return;
    a.innerHTML = handHtml(F.current, 'current'); a.classList.toggle('has-sel', !!F.current);
    b.innerHTML = handHtml(F.desired, 'desired'); b.classList.toggle('has-sel', !!F.desired);
    function says(n) { return n ? '<b>Nivel ' + n + ' · ' + LEVELS[n - 1].name + '.</b> ' + esc(LEVELS[n - 1].say) + '.' : 'Toca una carta para elegirla.'; }
    $('saysNow').innerHTML = says(F.current); $('saysGoal').innerHTML = says(F.desired);
    $('footCards').innerHTML = (F.current ? card(F.current, flip === 'current') : cardBack()) + '<span aria-hidden="true">→</span>' + (F.desired ? card(F.desired, flip === 'desired') : cardBack());
    var g = '';
    if (F.current && F.desired) {
      var diff = F.desired - F.current;
      g = diff === 0 ? 'Sin cambio de nivel: <b>se mantiene</b>.' : diff > 0 ? 'Se delega <b>' + diff + (diff === 1 ? ' nivel' : ' niveles') + ' más</b> al equipo.' : 'Se recentraliza <b>' + (-diff) + (diff === -1 ? ' nivel' : ' niveles') + '</b>.';
    } else g = 'Elige la carta de hoy y la deseada.';
    $('footGap').innerHTML = g;
  }
  function paintChips() {
    var c = $('chips'); if (!c || !F) return;
    var cur = $('fDate').value;
    c.innerHTML = [[1, '1 mes'], [3, '3 meses'], [6, '6 meses'], [12, '1 año']].map(function (p) {
      return '<button type="button" data-act="months" data-m="' + p[0] + '" aria-pressed="' + (cur === addMonths(F.startDate, p[0])) + '">' + p[1] + '</button>';
    }).join('');
  }

  function setSaving(on) {
    document.querySelectorAll('[data-act="save"]').forEach(function (b) { b.disabled = on; });
  }
  /* Cerrar sin guardar: si hay cambios, pide tocar otra vez para no perder lo escrito. */
  function requestClose() {
    if (!F) return;
    if (F.dirty && !F.closeArm) {
      F.closeArm = true;
      var er = $('formErr'); if (er) er.textContent = 'Hay cambios sin guardar. Usa “' + (F.id ? 'Guardar cambios' : 'Agregar al tablero') + '” o toca Cancelar otra vez para descartar.';
      return;
    }
    closeSheet();
  }
  async function saveDecision() {
    if (!F || F.saving) return;
    var err = $('formErr'); err.textContent = '';
    var title = $('fTitle').value.trim(), name = $('fName').value.trim(), date = $('fDate').value;
    if (!title) { err.textContent = 'Escribe qué decisión es.'; $('fTitle').focus(); return; }
    if (!name) { err.textContent = 'Indica la persona con autoridad.'; $('fName').focus(); return; }
    if (!F.current) { err.textContent = 'Elige la carta del nivel de hoy.'; return; }
    if (!F.desired) { err.textContent = 'Elige la carta del nivel deseado.'; return; }
    if (!date) { err.textContent = 'Define la fecha objetivo.'; $('fDate').focus(); return; }
    var data = {
      title: title, area: $('fAreaIn').value.trim(), team: $('fTeamIn').value.trim(),
      leaderName: name, leaderRole: $('fRole').value.trim(), current: F.current, desired: F.desired,
      startDate: F.startDate, targetDate: date, note: $('fNote').value.trim(), updatedAt: new Date().toISOString()
    };
    var isNew = !F.id;
    F.saving = true; setSaving(true);
    var ref = { id: F.id || newId() };
    /* Aparece en el tablero al instante; la base confirma después. */
    var prev = S.decisions.filter(function (x) { return x.id === ref.id; })[0] || null;
    var local = {}; Object.keys(data).forEach(function (k) { local[k] = data[k]; }); local.id = ref.id;
    S.pending[ref.id] = local;
    S.decisions = S.decisions.filter(function (x) { return x.id !== ref.id; }).concat([local]);
    S.loaded = true;
    closeSheet(); renderBoard();
    toast(isNew ? 'Decisión agregada al tablero' : 'Cambios guardados');
    var slow = setTimeout(function () { toast('Guardando… revisa tu conexión'); }, 8000);
    try {
      await DB.saveDecision(S.org.code, ref.id, data);
      clearTimeout(slow); delete S.pending[ref.id];
    } catch (e) {
      clearTimeout(slow); delete S.pending[ref.id];
      S.decisions = S.decisions.filter(function (x) { return x.id !== ref.id; });
      if (prev) S.decisions.push(prev);
      renderBoard();
      toast('No se pudo guardar: ' + dbMsg(e));
    }
  }
  async function deleteDecision() {
    if (!F || !F.id) return;
    var b = $('btnDel');
    if (!F.confirmDel) {
      F.confirmDel = true; b.textContent = '¿Seguro? Eliminar'; b.classList.add('danger');
      setTimeout(function () { if (F && b) { F.confirmDel = false; b.textContent = 'Eliminar'; } }, 4000);
      return;
    }
    b.disabled = true;
    var delId = F.id;
    try {
      await DB.removeDecision(S.org.code, delId);
      delete S.pending[delId];
      S.decisions = S.decisions.filter(function (x) { return x.id !== delId; });
      closeSheet(); renderBoard(); toast('Decisión eliminada');
    }
    catch (e) { b.disabled = false; $('formErr').textContent = dbMsg(e); }
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-edit]'); if (!t) return;
    var act = t.getAttribute('data-act');
    if (!act && t.hasAttribute('data-edit')) { openSheet(t.getAttribute('data-edit')); return; }
    switch (act) {
      case 'copy-code': copy(showCode(S.org.code), 'Código copiado'); break;
      case 'dismiss-created': S.created = false; renderNotice(); break;
      case 'leave': leaveOrg(); break;
      case 'open-demo': enterOrg(EJEMPLO_CODE); break;
      case 'build-mine': leaveOrg(); setTimeout(function () { var i = $('orgName'); if (i) i.focus(); }, 30); break;
      case 'level': var lv = +t.getAttribute('data-lv'); S.f.level = S.f.level === lv ? 0 : lv; renderBoard(); break;
      case 'clear': S.f = { area: '', team: '', leader: '', level: 0, q: '' }; var q = $('fq'); if (q) q.value = ''; renderBoard(); break;
      case 'view':
        S.view = t.getAttribute('data-v');
        document.querySelectorAll('[data-act="view"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === t)); });
        renderBoard(); break;
      case 'new': openSheet(null); break;
      case 'close': requestClose(); break;
      case 'pick':
        if (!F) break;
        var w = t.getAttribute('data-which'); F[w] = +t.getAttribute('data-lv'); F.dirty = true; F.closeArm = false; paintHands(w); break;
      case 'months': if (F) { $('fDate').value = addMonths(F.startDate, +t.getAttribute('data-m')); F.dirty = true; paintChips(); } break;
      case 'save': saveDecision(); break;
      case 'delete': deleteDecision(); break;
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && F) { requestClose(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-edit]')) { e.preventDefault(); openSheet(e.target.getAttribute('data-edit')); }
  });

  $('overlay').addEventListener('input', function () { if (F) { F.dirty = true; F.closeArm = false; } });

  /* ---------- arranque ---------- */
  renderLanding();
  if (location.hash === '#ejemplo') enterOrg(EJEMPLO_CODE);
  else if (/^#[A-Za-z0-9]{6}$/.test(location.hash)) enterOrg(location.hash.slice(1).toUpperCase());
  window.addEventListener('hashchange', function () { if (location.hash === '#ejemplo' && !(S.org && S.org.code === EJEMPLO_CODE)) enterOrg(EJEMPLO_CODE); });
})();
</script>
</body>
</html>
